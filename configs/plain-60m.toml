[model]
vocab_size = 32768
d_model = 512
n_layers = 13
pattern = "G"
mlp_hidden = 1344
norm_eps = 1e-6
gdn_heads = 8
gdn_head_dim = 64
conv_size = 4
init_std = 0.02
loss = "fused"
gate_mode = "linear"
pool_chunk = 64
pool_ckpt = true

[data]
bin_dir = "data/switch_1b"
seq_len = 2048
total_tokens = 1_000_000_000
# Rows are 2048-token interleaved-context samples (switch data). doc_mask = false: no cu_seqlens, so the
# recurrent state is reset only at the start of each 2048-token row, never at the EOT tokens inside a row.
doc_mask = false
seed = 1234

[data.mix]
switch = 1.0

[train]
run_name = "plain-60m"
micro_batch = 16
global_batch = 64
lr = 1.2e-3
min_lr_ratio = 0.0
warmup_steps = 500
decay_frac = 0.2
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
compile = true
max_steps = 0
log_every = 5
eval_every = 250
eval_batches = 16
save_every = 250
keep_every = 0
