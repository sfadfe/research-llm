[model]
vocab_size = 32768
d_model = 768
n_layers = 24
pattern = "GGGS"
mlp_hidden = 2048
norm_eps = 1e-6
gdn_heads = 6
gdn_head_dim = 128
conv_size = 4
nsa_q_heads = 16
nsa_kv_heads = 1
nsa_head_dim = 64
nsa_block_size = 64
nsa_block_counts = 8
nsa_window = 256
init_std = 0.02
loss = "fused"

[data]
bin_dir = "data/bin"
seq_len = 2048
total_tokens = 12_000_000_000
doc_mask = true
seed = 1234

[data.mix]
dclm = 0.45
fineweb_edu = 0.25
wikipedia = 0.10
gutenberg = 0.10
cosmopedia = 0.10

[train]
run_name = "hyb200m"
micro_batch = 8
global_batch = 256
lr = 1e-3
min_lr_ratio = 0.0
warmup_steps = 1000
decay_frac = 0.2
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
compile = true
max_steps = 0
log_every = 5
eval_every = 500
eval_batches = 4
save_every = 25
keep_every = 5000
